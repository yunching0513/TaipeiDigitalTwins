name: Deploy to GitHub Pages

# 這個 repo 的 GitHub Pages 目前沒有啟用（has_pages=false），所以 deploy job 一定會
# 失敗於 404「Ensure GitHub Pages has been enabled」。上次成功部署是 2026-07-06，
# 之後 Pages 被關掉，七月到十一月之間沒有任何推送所以沒人發現。
#
# 2026-11-20 移掉 push 觸發：留著只會讓每一次推 main 都紅一次，而這個專案沒有
# 正式的線上部署。build job（npm ci → npm run build）本身是好的，沒有動。
#
# 要恢復自動部署：先到 Settings → Pages 把 Source 設成「GitHub Actions」，
# 然後把 push 觸發加回來：
#     on:
#       push:
#         branches: [main]
#       workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
